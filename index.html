<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Post Maker</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  color:#111;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

h1{
  margin:0 0 6px;
}

.subtitle{
  color:#666;
  margin-bottom:25px;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}

h2{
  margin-top:0;
  font-size:20px;
}

label{
  display:block;
  font-weight:600;
  margin:12px 0 6px;
}

input,
select,
textarea,
button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  background:#111;
  color:white;
  border:none;
  cursor:pointer;
  margin-top:10px;
  font-weight:700;
}

button.secondary{
  background:#eee;
  color:#111;
}

button.green{
  background:#16803c;
}

button.blue{
  background:#1769d1;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.preview{
  width:100%;
  max-width:500px;
  margin:15px auto;
  display:block;
  border-radius:12px;
  background:#eee;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }
}

.row{
  display:flex;
  gap:10px;
}

.row>*{
  flex:1;
}

.status{
  background:#f0f2f5;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  white-space:pre-wrap;
}

.success{
  color:#16803c;
}

.error{
  color:#c62828;
}

.text-block{
  border:1px solid #ddd;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.text-block strong{
  display:block;
  margin-bottom:5px;
}

#canvasWrap{
  text-align:center;
}

canvas{
  max-width:100%;
  height:auto;
  border-radius:10px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
  background:white;
}

.small{
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

<h1>AI Post Maker</h1>
<div class="subtitle">
Create Instagram posts from a reference design using AI.
</div>


<!-- REFERENCE -->
<div class="card">

<h2>1. Reference Post</h2>

<label>Upload reference Instagram post</label>

<input
  type="file"
  id="referenceInput"
  accept="image/*"
>

<img
  id="referencePreview"
  class="preview"
  style="display:none"
>

<button
  id="analyzeBtn"
  class="blue"
>
Analyze Reference Layout
</button>

<div
  id="analysisStatus"
  class="status"
>
Waiting for reference image...
</div>

<div id="analysisDetails"></div>

</div>


<!-- TEXT -->
<div class="card">

<h2>2. Post Text</h2>

<label>Detected / New Headline</label>

<input
  id="headlineInput"
  placeholder="Headline"
>

<label>Supporting Text</label>

<textarea
  id="supportingInput"
  placeholder="Supporting text"
></textarea>

<button
  id="newTextBtn"
  class="secondary"
>
Generate Different Text
</button>

</div>


<!-- IMAGE -->
<div class="card">

<h2>3. Image</h2>

<label>Image Source</label>

<select id="imageSource">

<option value="ai">
AI Automatic
</option>

<option value="prompt">
AI Prompt
</option>

<option value="gallery">
Gallery
</option>

</select>


<div id="promptBox">

<label>AI Image Prompt</label>

<textarea
  id="imagePrompt"
  placeholder="Describe the image you want..."
></textarea>

<button
  id="generatePromptBtn"
  class="blue"
>
Generate Image From Prompt
</button>

</div>


<div id="galleryBox" style="display:none">

<label>Upload image</label>

<input
  type="file"
  id="galleryInput"
  accept="image/*"
>

</div>


<button
  id="changeImageBtn"
  class="green"
>
Change Image
</button>

<div
  id="imageStatus"
  class="status"
>
No generated image yet.
</div>

</div>


<!-- BRAND -->
<div class="card">

<h2>4. Brand Setup</h2>

<div class="grid">

<div>

<label>Upload Font</label>

<input
  type="file"
  id="fontInput"
  accept=".ttf,.otf,.woff,.woff2"
>

<div class="small">
Font is used locally for the final post.
</div>

</div>

<div>

<label>Upload Watermark PNG</label>

<input
  type="file"
  id="watermarkInput"
  accept="image/png"
>

</div>

</div>


<div class="grid">

<div>

<label>Watermark Position</label>

<select id="watermarkPosition">

<option value="top-right">Top Right</option>
<option value="top-left">Top Left</option>
<option value="bottom-right">Bottom Right</option>
<option value="bottom-left">Bottom Left</option>

</select>

</div>

<div>

<label>Watermark Size</label>

<input
  type="number"
  id="watermarkSize"
  value="120"
  min="20"
  max="500"
>

</div>

</div>


<label>Watermark Opacity</label>

<input
  type="range"
  id="watermarkOpacity"
  min="0"
  max="100"
  value="100"
>

</div>


<!-- SIZE -->
<div class="card">

<h2>5. Image Size</h2>

<select id="imageSize">

<option value="1080x1080">
1080 × 1080 Square
</option>

<option value="1080x1350">
1080 × 1350 Portrait
</option>

<option value="1080x566">
1080 × 566 Landscape
</option>

<option value="1080x1920">
1080 × 1920 Story / Reel
</option>

<option value="custom">
Custom
</option>

</select>

<div
  id="customSize"
  class="row"
  style="display:none"
>

<input
  type="number"
  id="customWidth"
  placeholder="Width"
>

<input
  type="number"
  id="customHeight"
  placeholder="Height"
>

</div>

</div>


<!-- TEXT STYLE -->
<div class="card">

<h2>6. Text Style</h2>

<label>Headline Size</label>

<input
  type="range"
  id="headlineSize"
  min="20"
  max="180"
  value="70"
>

<label>Text Alignment</label>

<select id="textAlignment">

<option value="left">Left</option>
<option value="center">Center</option>
<option value="right">Right</option>

</select>

</div>


<!-- CAROUSEL -->
<div class="card">

<h2>7. Carousel</h2>

<label>
<input
  type="checkbox"
  id="carouselEnabled"
  style="width:auto"
>
 Enable carousel / swipe
</label>

<label>Carousel Position</label>

<select id="carouselPosition">

<option value="top-right">Top Right</option>
<option value="top-left">Top Left</option>

</select>

</div>


<!-- FINAL -->
<div class="card">

<h2>8. Final Post</h2>

<div id="canvasWrap">
<canvas id="canvas"></canvas>
</div>

<button
  id="downloadBtn"
  class="green"
>
Download PNG
</button>

</div>

</div>


<script>

const ANALYZE_URL =
"https://zflphadtukkvvlbrzace.supabase.co/functions/v1/analyze-reference";

const GENERATE_URL =
"https://zflphadtukkvvlbrzace.supabase.co/functions/v1/generate-image";


let referenceImageData = null;
let generatedImageData = null;
let galleryImageData = null;

let analysisData = null;

let uploadedFont = null;
let watermarkImage = null;

let fontFamily = "Arial";


const referenceInput =
document.getElementById("referenceInput");

const referencePreview =
document.getElementById("referencePreview");

const analyzeBtn =
document.getElementById("analyzeBtn");

const analysisStatus =
document.getElementById("analysisStatus");

const analysisDetails =
document.getElementById("analysisDetails");

const headlineInput =
document.getElementById("headlineInput");

const supportingInput =
document.getElementById("supportingInput");

const newTextBtn =
document.getElementById("newTextBtn");

const imageSource =
document.getElementById("imageSource");

const promptBox =
document.getElementById("promptBox");

const galleryBox =
document.getElementById("galleryBox");

const imagePrompt =
document.getElementById("imagePrompt");

const generatePromptBtn =
document.getElementById("generatePromptBtn");

const galleryInput =
document.getElementById("galleryInput");

const changeImageBtn =
document.getElementById("changeImageBtn");

const imageStatus =
document.getElementById("imageStatus");

const fontInput =
document.getElementById("fontInput");

const watermarkInput =
document.getElementById("watermarkInput");

const watermarkPosition =
document.getElementById("watermarkPosition");

const watermarkSize =
document.getElementById("watermarkSize");

const watermarkOpacity =
document.getElementById("watermarkOpacity");

const imageSize =
document.getElementById("imageSize");

const customSize =
document.getElementById("customSize");

const customWidth =
document.getElementById("customWidth");

const customHeight =
document.getElementById("customHeight");

const headlineSize =
document.getElementById("headlineSize");

const textAlignment =
document.getElementById("textAlignment");

const carouselEnabled =
document.getElementById("carouselEnabled");

const carouselPosition =
document.getElementById("carouselPosition");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


/* ---------------- FILE READER ---------------- */

function readFile(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}


/* ---------------- REFERENCE ---------------- */

referenceInput.addEventListener("change",async()=>{

  const file = referenceInput.files[0];

  if(!file) return;

  referenceImageData =
    await readFile(file);

  referencePreview.src =
    referenceImageData;

  referencePreview.style.display =
    "block";

  analysisStatus.textContent =
    "Reference image loaded.";

});


/* ---------------- ANALYZE ---------------- */

analyzeBtn.addEventListener("click",async()=>{

  if(!referenceImageData){

    analysisStatus.textContent =
      "Please upload a reference image first.";

    return;
  }

  analyzeBtn.disabled = true;

  analysisStatus.textContent =
    "Analyzing reference with AI...";

  analysisDetails.innerHTML = "";

  try{

    const response =
      await fetch(
        ANALYZE_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            image:referenceImageData
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok || data.success === false){

      throw new Error(
        data.error ||
        "Analysis failed"
      );

    }

    /*
      Analyzer returns:

      {
        success:true,
        analysis:{
          text_blocks:[...]
        }
      }
    */

    analysisData =
      data.analysis ||
      data.result ||
      data;

    const blocks =
      analysisData.text_blocks ||
      analysisData.textBlocks ||
      data.text_blocks ||
      [];

    displayAnalysis(
      analysisData,
      blocks
    );

    /*
      IMPORTANT:
      Use the REAL text detected
      by the analyzer.
    */

    if(blocks.length){

      const headline =
        blocks.find(
          x => x.type === "headline"
        );

      const supporting =
        blocks.find(
          x =>
            x.type === "supporting" ||
            x.type === "body"
        );

      if(headline && headline.text){

        headlineInput.value =
          headline.text;

      }

      if(supporting && supporting.text){

        supportingInput.value =
          supporting.text;

      }

      /*
        If analyzer doesn't classify
        a block correctly, use the
        first two blocks.
      */

      if(!headlineInput.value &&
         blocks[0]?.text){

        headlineInput.value =
          blocks[0].text;

      }

      if(!supportingInput.value &&
         blocks[1]?.text){

        supportingInput.value =
          blocks[1].text;

      }

    }

    analysisStatus.innerHTML =
      '<span class="success">✓ Reference analyzed successfully.</span>';

  }catch(error){

    console.error(error);

    analysisStatus.innerHTML =
      '<span class="error">Analysis failed: ' +
      escapeHtml(error.message) +
      '</span>';

  }

  analyzeBtn.disabled = false;

});


/* ---------------- DISPLAY ANALYSIS ---------------- */

function displayAnalysis(
  analysis,
  blocks
){

  let html = "";

  html += `
    <div class="text-block">
      <strong>Layout</strong>
      ${escapeHtml(
        analysis.overall_layout ||
        "Detected"
      )}
    </div>
  `;

  html += `
    <div class="text-block">
      <strong>Aspect Ratio</strong>
      ${escapeHtml(
        analysis.aspect_ratio ||
        "Detected automatically"
      )}
    </div>
  `;

  if(
    analysis.main_image_area
  ){

    html += `
      <div class="text-block">
        <strong>Main Image Area</strong>
        x: ${analysis.main_image_area.x || 0}%
        &nbsp;
        y: ${analysis.main_image_area.y || 0}%
        &nbsp;
        width: ${analysis.main_image_area.width || 0}%
        &nbsp;
        height: ${analysis.main_image_area.height || 0}%
      </div>
    `;

  }

  html += `
    <div class="text-block">
      <strong>Detected Text</strong>
      ${blocks.length}
      text block(s)
    </div>
  `;

  blocks.forEach((block,index)=>{

    html += `
      <div class="text-block">

        <strong>
          ${escapeHtml(
            block.type ||
            "Text"
          )}
        </strong>

        <div>
          ${escapeHtml(
            block.text ||
            "(No readable text)"
          )}
        </div>

        <div class="small">
          Position:
          ${block.x || 0}%,
          ${block.y || 0}%
          &nbsp; | &nbsp;
          ${block.width || 0}% ×
          ${block.height || 0}%
        </div>

      </div>
    `;

  });

  analysisDetails.innerHTML =
    html;

}


/* ---------------- NEW TEXT ---------------- */

newTextBtn.addEventListener(
  "click",
  ()=>{

    const oldHeadline =
      headlineInput.value.trim();

    const oldSupporting =
      supportingInput.value.trim();

    /*
      For now this creates a
      related alternative locally.

      Later we can connect this
      to AI text generation.
    */

    const headlineOptions = [

      "Interesting Facts You Should Know",

      "You Probably Didn't Know This",

      "Facts That Will Surprise You",

      "Things You Never Knew",

      "One Fact You Should Know"

    ];

    const supportOptions = [

      "Here is something worth knowing.",

      "This simple fact is more interesting than it looks.",

      "You might be surprised by this information.",

      "A fascinating fact you probably haven't heard before."

    ];

    let headline =
      headlineOptions[
        Math.floor(
          Math.random() *
          headlineOptions.length
        )
      ];

    let supporting =
      supportOptions[
        Math.floor(
          Math.random() *
          supportOptions.length
        )
      ];

    if(
      headline.toLowerCase() ===
      oldHeadline.toLowerCase()
    ){

      headline =
        headlineOptions[
          (headlineOptions.indexOf(headline)+1)
          % headlineOptions.length
        ];

    }

    if(
      supporting.toLowerCase() ===
      oldSupporting.toLowerCase()
    ){

      supporting =
        supportOptions[
          (supportOptions.indexOf(supporting)+1)
          % supportOptions.length
        ];

    }

    headlineInput.value =
      headline;

    supportingInput.value =
      supporting;

    drawCanvas();

  }
);


/* ---------------- IMAGE SOURCE ---------------- */

imageSource.addEventListener(
  "change",
  ()=>{

    if(
      imageSource.value ===
      "gallery"
    ){

      galleryBox.style.display =
        "block";

      promptBox.style.display =
        "none";

    }else{

      galleryBox.style.display =
        "none";

      promptBox.style.display =
        "block";

    }

  }
);


/* ---------------- GALLERY ---------------- */

galleryInput.addEventListener(
  "change",
  async()=>{

    const file =
      galleryInput.files[0];

    if(!file) return;

    galleryImageData =
      await readFile(file);

    generatedImageData =
      galleryImageData;

    imageStatus.textContent =
      "Gallery image loaded.";

    drawCanvas();

  }
);


/* ---------------- IMAGE GENERATION ---------------- */

async function generateAIImage(
  customPrompt=""
){

  if(!referenceImageData){

    throw new Error(
      "Upload and analyze a reference image first."
    );

  }

  imageStatus.textContent =
    "Generating AI image...";

  changeImageBtn.disabled =
    true;

  generatePromptBtn.disabled =
    true;

  /*
    Use detected layout information
    when creating the image prompt.
  */

  let layoutDescription = "";

  if(analysisData){

    layoutDescription =
      JSON.stringify({

        layout:
          analysisData.overall_layout,

        imageArea:
          analysisData.main_image_area,

        composition:
          analysisData.composition,

        designNotes:
          analysisData.design_notes

      });

  }

  const headline =
    headlineInput.value.trim();

  const supporting =
    supportingInput.value.trim();

  let prompt;

  if(customPrompt){

    prompt =
      customPrompt;

  }else{

    prompt = `
Create a completely new original image
for an Instagram fact post.

The image should visually fit the
reference post's composition.

IMPORTANT:

Do not create text.
Do not create letters.
Do not create logos.
Do not create watermarks.

The final text will be added separately
by the website.

Headline concept:
${headline}

Supporting concept:
${supporting}

Reference layout information:
${layoutDescription}

Create a visually attractive,
photorealistic or highly suitable image
for an Instagram facts page.

Make the image different from the
reference image while preserving the
general visual composition.
`;

  }

  try{

    const widthHeight =
      getSize();

    const response =
      await fetch(
        GENERATE_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            prompt:prompt,

            referenceImage:
              referenceImageData,

            width:
              widthHeight.width,

            height:
              widthHeight.height

          })

        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Image generation failed"
      );

    }

    if(
      !data.image
    ){

      throw new Error(
        "No image returned by AI."
      );

    }

    generatedImageData =
      data.image;

    imageStatus.innerHTML =
      '<span class="success">✓ AI image generated.</span>';

    drawCanvas();

  }catch(error){

    console.error(error);

    imageStatus.innerHTML =
      '<span class="error">' +
      escapeHtml(error.message) +
      '</span>';

  }

  changeImageBtn.disabled =
    false;

  generatePromptBtn.disabled =
    false;

}


/* ---------------- CHANGE IMAGE ---------------- */

changeImageBtn.addEventListener(
  "click",
  async()=>{

    await generateAIImage();

  }
);


/* ---------------- PROMPT IMAGE ---------------- */

generatePromptBtn.addEventListener(
  "click",
  async()=>{

    const prompt =
      imagePrompt.value.trim();

    if(!prompt){

      imageStatus.textContent =
        "Enter an image prompt first.";

      return;

    }

    await generateAIImage(
      prompt
    );

  }
);


/* ---------------- FONT ---------------- */

fontInput.addEventListener(
  "change",
  async()=>{

    const file =
      fontInput.files[0];

    if(!file) return;

    uploadedFont =
      await readFile(file);

    fontFamily =
      "UploadedFont";

    const style =
      document.createElement("style");

    style.innerHTML = `
      @font-face{
        font-family:UploadedFont;
        src:url("${uploadedFont}");
      }
    `;

    document.head.appendChild(
      style
    );

    drawCanvas();

  }
);


/* ---------------- WATERMARK ---------------- */

watermarkInput.addEventListener(
  "change",
  async()=>{

    const file =
      watermarkInput.files[0];

    if(!file) return;

    const data =
      await readFile(file);

    watermarkImage =
      new Image();

    watermarkImage.onload =
      () => drawCanvas();

    watermarkImage.src =
      data;

  }
);


watermarkPosition.addEventListener(
  "change",
  drawCanvas
);

watermarkSize.addEventListener(
  "input",
  drawCanvas
);

watermarkOpacity.addEventListener(
  "input",
  drawCanvas
);


/* ---------------- SIZE ---------------- */

imageSize.addEventListener(
  "change",
  ()=>{

    customSize.style.display =
      imageSize.value === "custom"
        ? "flex"
        : "none";

    drawCanvas();

  }
);

customWidth.addEventListener(
  "input",
  drawCanvas
);

customHeight.addEventListener(
  "input",
  drawCanvas
);


/* ---------------- TEXT STYLE ---------------- */

headlineSize.addEventListener(
  "input",
  drawCanvas
);

textAlignment.addEventListener(
  "change",
  drawCanvas
);

headlineInput.addEventListener(
  "input",
  drawCanvas
);

supportingInput.addEventListener(
  "input",
  drawCanvas
);


/* ---------------- SIZE HELPER ---------------- */

function getSize(){

  if(
    imageSize.value ===
    "custom"
  ){

    return {

      width:
        parseInt(
          customWidth.value
        ) || 1080,

      height:
        parseInt(
          customHeight.value
        ) || 1080

    };

  }

  const [
    width,
    height
  ] =
    imageSize.value
      .split("x")
      .map(Number);

  return {
    width,
    height
  };

}


/* ---------------- CANVAS ---------------- */

async function drawCanvas(){

  const size =
    getSize();

  canvas.width =
    size.width;

  canvas.height =
    size.height;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  /*
    Background
  */

  ctx.fillStyle =
    "#ffffff";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Draw generated image
  */

  if(generatedImageData){

    const img =
      new Image();

    img.onload =
      () => {

        drawImageWithLayout(
          img
        );

        drawText();

        drawWatermark();

      };

    img.src =
      generatedImageData;

  }else{

    drawPlaceholder();

    drawText();

    drawWatermark();

  }

}


/* ---------------- IMAGE LAYOUT ---------------- */

function drawImageWithLayout(
  img
){

  let area = null;

  if(
    analysisData &&
    analysisData.main_image_area
  ){

    area =
      analysisData.main_image_area;

  }

  /*
    If AI detected image area,
    use it.

    Otherwise fill canvas.
  */

  if(area){

    const x =
      canvas.width *
      ((area.x || 0)/100);

    const y =
      canvas.height *
      ((area.y || 0)/100);

    const w =
      canvas.width *
      ((area.width || 100)/100);

    const h =
      canvas.height *
      ((area.height || 100)/100);

    drawCover(
      img,
      x,
      y,
      w,
      h
    );

  }else{

    drawCover(
      img,
      0,
      0,
      canvas.width,
      canvas.height
    );

  }

}


/* ---------------- COVER IMAGE ---------------- */

function drawCover(
  img,
  x,
  y,
  w,
  h
){

  const imageRatio =
    img.width /
    img.height;

  const boxRatio =
    w / h;

  let drawWidth;
  let drawHeight;

  if(
    imageRatio >
    boxRatio
  ){

    drawHeight =
      h;

    drawWidth =
      h * imageRatio;

  }else{

    drawWidth =
      w;

    drawHeight =
      w / imageRatio;

  }

  const dx =
    x +
    (w-drawWidth)/2;

  const dy =
    y +
    (h-drawHeight)/2;

  ctx.save();

  ctx.beginPath();

  ctx.rect(
    x,
    y,
    w,
    h
  );

  ctx.clip();

  ctx.drawImage(
    img,
    dx,
    dy,
    drawWidth,
    drawHeight
  );

  ctx.restore();

}


/* ---------------- PLACEHOLDER ---------------- */

function drawPlaceholder(){

  ctx.fillStyle =
    "#eeeeee";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle =
    "#888";

  ctx.textAlign =
    "center";

  ctx.font =
    "40px Arial";

  ctx.fillText(
    "Generate an image",
    canvas.width/2,
    canvas.height/2
  );

}


/* ---------------- TEXT ---------------- */

function drawText(){

  const headline =
    headlineInput.value.trim();

  const supporting =
    supportingInput.value.trim();

  /*
    If analyzer found text blocks,
    use their approximate positions.
  */

  const blocks =
    analysisData?.text_blocks ||
    [];

  const headlineBlock =
    blocks.find(
      x => x.type === "headline"
    );

  const supportingBlock =
    blocks.find(
      x =>
        x.type === "supporting" ||
        x.type === "body"
    );


  /* HEADLINE */

  if(headline){

    let x =
      canvas.width/2;

    let y =
      canvas.height * .15;

    let width =
      canvas.width * .9;

    let align =
      textAlignment.value;

    if(headlineBlock){

      x =
        canvas.width *
        ((headlineBlock.x || 50)/100);

      y =
        canvas.height *
        ((headlineBlock.y || 15)/100);

      width =
        canvas.width *
        ((headlineBlock.width || 90)/100);

      align =
        headlineBlock.alignment ||
        align;

    }

    ctx.fillStyle =
      headlineBlock?.color ||
      "#ffffff";

    ctx.font =
      "bold " +
      headlineSize.value +
      "px " +
      fontFamily;

    ctx.textAlign =
      align;

    ctx.textBaseline =
      "top";

    /*
      Add subtle shadow so text
      remains readable.
    */

    ctx.shadowColor =
      "rgba(0,0,0,.45)";

    ctx.shadowBlur =
      8;

    wrapText(
      headline,
      x,
      y,
      width,
      parseInt(
        headlineSize.value
      ) * 1.15,
      align
    );

    ctx.shadowBlur =
      0;

  }


  /* SUPPORTING */

  if(supporting){

    let x =
      canvas.width/2;

    let y =
      canvas.height * .3;

    let width =
      canvas.width * .85;

    let align =
      textAlignment.value;

    if(supportingBlock){

      x =
        canvas.width *
        ((supportingBlock.x || 50)/100);

      y =
        canvas.height *
        ((supportingBlock.y || 30)/100);

      width =
        canvas.width *
        ((supportingBlock.width || 85)/100);

      align =
        supportingBlock.alignment ||
        align;

    }

    ctx.fillStyle =
      supportingBlock?.color ||
      "#ffffff";

    ctx.font =
      Math.max(
        28,
        parseInt(
          headlineSize.value
        ) * .42
      ) +
      "px " +
      fontFamily;

    ctx.textAlign =
      align;

    ctx.textBaseline =
      "top";

    ctx.shadowColor =
      "rgba(0,0,0,.45)";

    ctx.shadowBlur =
      6;

    wrapText(
      supporting,
      x,
      y,
      width,
      Math.max(
        28,
        parseInt(
          headlineSize.value
        ) * .55
      ),
      align
    );

    ctx.shadowBlur =
      0;

  }

}


/* ---------------- WRAP TEXT ---------------- */

function wrapText(
  text,
  x,
  y,
  maxWidth,
  lineHeight,
  align
){

  const words =
    text.split(" ");

  let line = "";

  const lines = [];

  for(
    let i=0;
    i<words.length;
    i++
  ){

    const test =
      line +
      words[i] +
      " ";

    const metrics =
      ctx.measureText(
        test
      );

    if(
      metrics.width >
      maxWidth &&
      line
    ){

      lines.push(
        line.trim()
      );

      line =
        words[i] + " ";

    }else{

      line =
        test;

    }

  }

  if(line){
    lines.push(
      line.trim()
    );
  }

  lines.forEach(
    (lineText,index)=>{

      let drawX =
        x;

      if(
        align ===
        "left"
      ){

        drawX =
          x;

      }else if(
        align ===
        "right"
      ){

        drawX =
          x;

      }else{

        drawX =
          x;

      }

      ctx.fillText(
        lineText,
        drawX,
        y +
        index *
        lineHeight
      );

    }
  );

}


/* ---------------- WATERMARK ---------------- */

function drawWatermark(){

  if(!watermarkImage)
    return;

  const size =
    parseInt(
      watermarkSize.value
    ) || 120;

  const ratio =
    watermarkImage.width /
    watermarkImage.height;

  const width =
    size;

  const height =
    size /
    ratio;

  const margin =
    canvas.width *
    .03;

  let x;
  let y;

  switch(
    watermarkPosition.value
  ){

    case "top-left":

      x =
        margin;

      y =
        margin;

      break;

    case "bottom-left":

      x =
        margin;

      y =
        canvas.height -
        height -
        margin;

      break;

    case "bottom-right":

      x =
        canvas.width -
        width -
        margin;

      y =
        canvas.height -
        height -
        margin;

      break;

    default:

      x =
        canvas.width -
        width -
        margin;

      y =
        margin;

  }

  ctx.save();

  ctx.globalAlpha =
    parseInt(
      watermarkOpacity.value
    ) / 100;

  ctx.drawImage(
    watermarkImage,
    x,
    y,
    width,
    height
  );

  ctx.restore();

}

/* ---------------- ESCAPE HTML ---------------- */

function escapeHtml(
  value
){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
