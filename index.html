<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Post Maker</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:18px 20px;
  font-size:22px;
  font-weight:700;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:600;
  margin-top:15px;
  margin-bottom:6px;
}

input,
select,
button,
textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  background:#111;
  color:white;
  border:none;
  cursor:pointer;
  font-weight:700;
  margin-top:12px;
}

button:hover{
  opacity:.9;
}

.secondary{
  background:#e9e9e9;
  color:#111;
}

.row{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.row3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.preview-area{
  text-align:center;
}

canvas{
  max-width:100%;
  height:auto;
  border-radius:10px;
  background:#ddd;
  box-shadow:0 5px 25px rgba(0,0,0,.15);
}

.small{
  font-size:13px;
  color:#666;
  margin-top:5px;
}

.status{
  background:#f0f0f0;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  font-size:13px;
}

@media(max-width:700px){
  .row,
  .row3{
    grid-template-columns:1fr;
  }

  .container{
    padding:12px;
  }

  .card{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>
  AI Post Maker
</header>

<div class="container">

<!-- BRAND SETUP -->

<div class="card">

<h2>Brand Setup</h2>

<label>Upload Your Font</label>
<input
  type="file"
  id="fontInput"
  accept=".ttf,.otf,.woff,.woff2"
>

<div class="small">
Your font is used in the post preview.
</div>

<label>Upload Watermark PNG</label>
<input
  type="file"
  id="watermarkInput"
  accept="image/png"
>

<div class="row">

<div>
<label>Watermark Position</label>

<select id="watermarkPosition">

<option value="top-left">Top Left</option>
<option value="top-right">Top Right</option>
<option value="bottom-left">Bottom Left</option>
<option value="bottom-right">Bottom Right</option>

</select>
</div>

<div>
<label>Watermark Size</label>

<input
  type="range"
  id="watermarkSize"
  min="30"
  max="500"
  value="150"
>

<div class="small">
<span id="watermarkSizeValue">150</span> px
</div>

</div>

</div>

<label>Watermark Opacity</label>

<input
  type="range"
  id="watermarkOpacity"
  min="0"
  max="100"
  value="100"
>

<div class="small">
<span id="watermarkOpacityValue">100</span>%
</div>

</div>


<!-- IMAGE SIZE -->

<div class="card">

<h2>Image Size</h2>

<label>Instagram Format</label>

<select id="imageSize">

<option value="1080x1080">
Square — 1080 × 1080
</option>

<option value="1080x1350">
Portrait — 1080 × 1350
</option>

<option value="1080x566">
Landscape — 1080 × 566
</option>

<option value="1080x1920">
Story / Reel — 1080 × 1920
</option>

<option value="custom">
Custom
</option>

</select>

<div
  id="customSize"
  class="row"
  style="display:none;"
>

<div>

<label>Width</label>

<input
  type="number"
  id="customWidth"
  value="1080"
  min="100"
  max="5000"
>

</div>

<div>

<label>Height</label>

<input
  type="number"
  id="customHeight"
  value="1080"
  min="100"
  max="5000"
>

</div>

</div>

</div>


<!-- REFERENCE POST -->

<div class="card">

<h2>Reference Post</h2>

<label>Upload Reference Image</label>

<input
  type="file"
  id="referenceInput"
  accept="image/*"
>

<div class="small">
Upload the Instagram post you want to use as the visual reference.
</div>

</div>


<!-- TEXT -->

<div class="card">

<h2>Post Text</h2>

<label>Headline</label>

<textarea
  id="headline"
  placeholder="Enter your headline..."
>YOUR FACT HEADLINE</textarea>

<label>Supporting Text</label>

<textarea
  id="subtitle"
  placeholder="Enter supporting text..."
>Write your supporting text here.</textarea>

<div class="row">

<div>

<label>Headline Size</label>

<input
  type="range"
  id="headlineSize"
  min="30"
  max="180"
  value="80"
>

<div class="small">
<span id="headlineSizeValue">80</span> px
</div>

</div>

<div>

<label>Text Alignment</label>

<select id="textAlign">

<option value="left">Left</option>
<option value="center">Center</option>
<option value="right">Right</option>

</select>

</div>

</div>

</div>


<!-- CAROUSEL -->

<div class="card">

<h2>Carousel / Swipe Button</h2>

<label>Show Swipe Button</label>

<select id="carouselEnabled">

<option value="false">OFF</option>
<option value="true">ON</option>

</select>

<label>Swipe Button Position</label>

<select id="carouselPosition">

<option value="top-left">Top Left</option>
<option value="top-right">Top Right</option>

</select>

</div>


<!-- PREVIEW -->

<div class="card preview-area">

<h2>Live Preview</h2>

<canvas
  id="canvas"
  width="1080"
  height="1080"
></canvas>

<button id="downloadButton">
Download PNG
</button>

<button
  id="saveSettingsButton"
  class="secondary"
>
Save Settings
</button>

<div
  id="status"
  class="status"
>
Ready
</div>

</div>

</div>


<script>

let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let referenceImage = null;
let watermarkImage = null;

let customFontFamily = "Arial";


// -------------------------
// ELEMENTS
// -------------------------

const fontInput =
  document.getElementById("fontInput");

const watermarkInput =
  document.getElementById("watermarkInput");

const referenceInput =
  document.getElementById("referenceInput");

const imageSize =
  document.getElementById("imageSize");

const customSize =
  document.getElementById("customSize");

const customWidth =
  document.getElementById("customWidth");

const customHeight =
  document.getElementById("customHeight");

const watermarkPosition =
  document.getElementById("watermarkPosition");

const watermarkSize =
  document.getElementById("watermarkSize");

const watermarkOpacity =
  document.getElementById("watermarkOpacity");

const carouselEnabled =
  document.getElementById("carouselEnabled");

const carouselPosition =
  document.getElementById("carouselPosition");

const headline =
  document.getElementById("headline");

const subtitle =
  document.getElementById("subtitle");

const headlineSize =
  document.getElementById("headlineSize");

const textAlign =
  document.getElementById("textAlign");


// -------------------------
// SIZE VALUES
// -------------------------

function getCanvasSize(){

  if(imageSize.value === "custom"){

    return {
      width:parseInt(customWidth.value) || 1080,
      height:parseInt(customHeight.value) || 1080
    };

  }

  const parts =
    imageSize.value.split("x");

  return {
    width:parseInt(parts[0]),
    height:parseInt(parts[1])
  };
}


// -------------------------
// CANVAS SIZE
// -------------------------

function updateCanvasSize(){

  const size = getCanvasSize();

  canvas.width = size.width;
  canvas.height = size.height;

  drawCanvas();
}


// -------------------------
// DRAW IMAGE COVER
// -------------------------

function drawCoverImage(img){

  const cw = canvas.width;
  const ch = canvas.height;

  const iw = img.width;
  const ih = img.height;

  const scale =
    Math.max(cw / iw, ch / ih);

  const nw = iw * scale;
  const nh = ih * scale;

  const x = (cw - nw) / 2;
  const y = (ch - nh) / 2;

  ctx.drawImage(
    img,
    x,
    y,
    nw,
    nh
  );
}


// -------------------------
// DRAW WATERMARK
// -------------------------

function drawWatermark(){

  if(!watermarkImage) return;

  const size =
    parseInt(watermarkSize.value);

  const opacity =
    parseInt(watermarkOpacity.value) / 100;

  const ratio =
    watermarkImage.width /
    watermarkImage.height;

  let w = size;
  let h = size / ratio;

  const margin = 35;

  let x = margin;
  let y = margin;

  if(
    watermarkPosition.value ===
    "top-right"
  ){
    x = canvas.width - w - margin;
  }

  if(
    watermarkPosition.value ===
    "bottom-left"
  ){
    y = canvas.height - h - margin;
  }

  if(
    watermarkPosition.value ===
    "bottom-right"
  ){
    x = canvas.width - w - margin;
    y = canvas.height - h - margin;
  }

  ctx.save();

  ctx.globalAlpha = opacity;

  ctx.drawImage(
    watermarkImage,
    x,
    y,
    w,
    h
  );

  ctx.restore();
}


// -------------------------
// DRAW SWIPE
// -------------------------

function drawSwipeButton(){

  if(
    carouselEnabled.value !==
    "true"
  ){
    return;
  }

  const size = 65;
  const margin = 30;

  let x;

  if(
    carouselPosition.value ===
    "top-left"
  ){
    x = margin;
  }else{
    x = canvas.width - size - margin;
  }

  const y = margin;

  ctx.save();

  ctx.fillStyle =
    "rgba(0,0,0,.65)";

  ctx.beginPath();

  ctx.arc(
    x + size/2,
    y + size/2,
    size/2,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle = "white";

  ctx.font =
    "bold 38px Arial";

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    "›",
    x + size/2,
    y + size/2
  );

  ctx.restore();
}


// -------------------------
// WRAP TEXT
// -------------------------

function drawWrappedText(
  text,
  x,
  y,
  maxWidth,
  lineHeight
){

  const words =
    text.split(" ");

  let line = "";

  for(
    let i = 0;
    i < words.length;
    i++
  ){

    const testLine =
      line + words[i] + " ";

    const metrics =
      ctx.measureText(testLine);

    if(
      metrics.width > maxWidth &&
      i > 0
    ){

      ctx.fillText(
        line,
        x,
        y
      );

      line =
        words[i] + " ";

      y += lineHeight;

    }else{

      line = testLine;

    }
  }

  ctx.fillText(
    line,
    x,
    y
  );
}


// -------------------------
// DRAW TEXT
// -------------------------

function drawText(){

  const padding = 70;

  const size =
    parseInt(headlineSize.value);

  ctx.save();

  ctx.fillStyle = "white";

  ctx.font =
    `bold ${size}px ${customFontFamily}`;

  ctx.textAlign =
    textAlign.value;

  let x;

  if(textAlign.value === "left"){
    x = padding;
  }

  else if(
    textAlign.value === "right"
  ){
    x = canvas.width - padding;
  }

  else{
    x = canvas.width / 2;
  }

  const y =
    canvas.height - 250;

  drawWrappedText(
    headline.value,
    x,
    y,
    canvas.width - padding * 2,
    size * 1.15
  );

  ctx.font =
    `${Math.round(size * .45)}px ${customFontFamily}`;

  ctx.globalAlpha = .9;

  drawWrappedText(
    subtitle.value,
    x,
    y + size * 1.5,
    canvas.width - padding * 2,
    size * .6
  );

  ctx.restore();
}


// -------------------------
// MAIN DRAW
// -------------------------

function drawCanvas(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  // Background

  ctx.fillStyle = "#222";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  // Reference image

  if(referenceImage){

    drawCoverImage(
      referenceImage
    );

  }


  // Dark gradient behind text

  const gradient =
    ctx.createLinearGradient(
      0,
      canvas.height * .45,
      0,
      canvas.height
    );

  gradient.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,.85)"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    canvas.height * .4,
    canvas.width,
    canvas.height * .6
  );


  drawText();

  drawWatermark();

  drawSwipeButton();

}


// -------------------------
// FONT UPLOAD
// -------------------------

fontInput.addEventListener(
  "change",
  async function(){

    const file =
      fontInput.files[0];

    if(!file) return;

    const fontURL =
      URL.createObjectURL(file);

    customFontFamily =
      "UserUploadedFont";

    const font =
      new FontFace(
        customFontFamily,
        `url(${fontURL})`
      );

    try{

      await font.load();

      document.fonts.add(font);

      setStatus(
        "Font loaded successfully."
      );

      drawCanvas();

    }catch(error){

      setStatus(
        "Could not load this font."
      );

    }

  }
);


// -------------------------
// WATERMARK UPLOAD
// -------------------------

watermarkInput.addEventListener(
  "change",
  function(){

    const file =
      watermarkInput.files[0];

    if(!file) return;

    const url =
      URL.createObjectURL(file);

    const img =
      new Image();

    img.onload = function(){

      watermarkImage = img;

      setStatus(
        "Watermark loaded."
      );

      drawCanvas();

    };

    img.src = url;

  }
);


// -------------------------
// REFERENCE IMAGE
// -------------------------

referenceInput.addEventListener(
  "change",
  function(){

    const file =
      referenceInput.files[0];

    if(!file) return;

    const url =
      URL.createObjectURL(file);

    const img =
      new Image();

    img.onload = function(){

      referenceImage = img;

      setStatus(
        "Reference image loaded."
      );

      drawCanvas();

    };

    img.src = url;

  }
);


// -------------------------
// CUSTOM SIZE
// -------------------------

imageSize.addEventListener(
  "change",
  function(){

    if(
      imageSize.value ===
      "custom"
    ){

      customSize.style.display =
        "grid";

    }else{

      customSize.style.display =
        "none";

    }

    updateCanvasSize();

  }
);

customWidth.addEventListener(
  "input",
  updateCanvasSize
);

customHeight.addEventListener(
  "input",
  updateCanvasSize
);


// -------------------------
// LIVE CONTROLS
// -------------------------

watermarkPosition.addEventListener(
  "change",
  drawCanvas
);

watermarkSize.addEventListener(
  "input",
  function(){

    document.getElementById(
      "watermarkSizeValue"
    ).textContent =
      watermarkSize.value;

    drawCanvas();

  }
);

watermarkOpacity.addEventListener(
  "input",
  function(){

    document.getElementById(
      "watermarkOpacityValue"
    ).textContent =
      watermarkOpacity.value;

    drawCanvas();

  }
);

carouselEnabled.addEventListener(
  "change",
  drawCanvas
);

carouselPosition.addEventListener(
  "change",
  drawCanvas
);

headline.addEventListener(
  "input",
  drawCanvas
);

subtitle.addEventListener(
  "input",
  drawCanvas
);

headlineSize.addEventListener(
  "input",
  function(){

    document.getElementById(
      "headlineSizeValue"
    ).textContent =
      headlineSize.value;

    drawCanvas();

  }
);

textAlign.addEventListener(
  "change",
  drawCanvas
);


// -------------------------
// SAVE SETTINGS
// -------------------------

function saveSettings(){

  const settings = {

    imageSize:
      imageSize.value,

    customWidth:
      customWidth.value,

    customHeight:
      customHeight.value,

    watermarkPosition:
      watermarkPosition.value,

    watermarkSize:
      watermarkSize.value,

    watermarkOpacity:
      watermarkOpacity.value,

    carouselEnabled:
      carouselEnabled.value,

    carouselPosition:
      carouselPosition.value,

    headlineSize:
      headlineSize.value,

    textAlign:
      textAlign.value,

    headline:
      headline.value,

    subtitle:
      subtitle.value

  };

  localStorage.setItem(
    "aiPostMakerSettings",
    JSON.stringify(settings)
  );

  setStatus(
    "Settings saved on this device."
  );

}


// -------------------------
// LOAD SETTINGS
// -------------------------

function loadSettings(){

  const saved =
    localStorage.getItem(
      "aiPostMakerSettings"
    );

  if(!saved) return;

  try{

    const s =
      JSON.parse(saved);

    if(s.imageSize)
      imageSize.value =
        s.imageSize;

    if(s.customWidth)
      customWidth.value =
        s.customWidth;

    if(s.customHeight)
      customHeight.value =
        s.customHeight;

    if(s.watermarkPosition)
      watermarkPosition.value =
        s.watermarkPosition;

    if(s.watermarkSize)
      watermarkSize.value =
        s.watermarkSize;

    if(s.watermarkOpacity)
      watermarkOpacity.value =
        s.watermarkOpacity;

    if(s.carouselEnabled)
      carouselEnabled.value =
        s.carouselEnabled;

    if(s.carouselPosition)
      carouselPosition.value =
        s.carouselPosition;

    if(s.headlineSize)
      headlineSize.value =
        s.headlineSize;

    if(s.textAlign)
      textAlign.value =
        s.textAlign;

    if(s.headline)
      headline.value =
        s.headline;

    if(s.subtitle)
      subtitle.value =
        s.subtitle;

    document.getElementById(
      "watermarkSizeValue"
    ).textContent =
      watermarkSize.value;

    document.getElementById(
      "watermarkOpacityValue"
    ).textContent =
      watermarkOpacity.value;

    document.getElementById(
      "headlineSizeValue"
    ).textContent =
      headlineSize.value;

    if(
      imageSize.value ===
      "custom"
    ){

      customSize.style.display =
        "grid";

    }

  }catch(error){

    console.log(error);

  }

}


// -------------------------
// STATUS
// -------------------------

function setStatus(message){

  document.getElementById(
    "status"
  ).textContent =
    message;

}


// -------------------------
// DOWNLOAD
// -------------------------

document.getElementById(
  "downloadButton"
).addEventListener(
  "click",
  function(){

    const link =
      document.createElement("a");

    link.download =
      "ai-post-maker.png";

    link.href =
      canvas.toDataURL(
        "image/png"
      );

    link.click();

  }
);


// -------------------------
// SAVE BUTTON
// -------------------------

document.getElementById(
  "saveSettingsButton"
).addEventListener(
  "click",
  saveSettings
);


// -------------------------
// START
// -------------------------

loadSettings();

updateCanvasSize();

</script>

</body>
</html>
